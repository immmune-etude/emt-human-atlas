name: Apply scenario anatomy pulse

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch pulsing scenario highlights
        run: |
          python - <<'PY'
          from pathlib import Path

          scene_path = Path('src/components/AtlasScene.jsx')
          text = scene_path.read_text()

          replacements = [
            (
              "        shader.uniforms.stateWidth = { value: textureWidth }\n",
              "        shader.uniforms.stateWidth = { value: textureWidth }\n        shader.uniforms.pulseTime = { value: 0 }\n        material.userData.shader = shader\n",
            ),
            (
              "shader.fragmentShader = `varying float partVisible;",
              "shader.fragmentShader = `uniform float pulseTime; varying float partVisible;",
            ),
            (
              "vec3(0.93, 0.42, 0.26), partHighlight.g * 0.52",
              "vec3(1.0, 0.78, 0.08), partHighlight.g * (0.48 + 0.42 * (0.5 + 0.5 * sin(pulseTime * 2.15)))",
            ),
            (
              "      controls.update(Math.min(clock.getDelta(), 0.05))\n      updateModelState(false)\n",
              "      const delta = Math.min(clock.getDelta(), 0.05)\n      controls.update(delta)\n      const pulseTime = clock.elapsedTime\n      materials.forEach((material) => {\n        const shader = material.userData.shader\n        if (shader?.uniforms?.pulseTime) shader.uniforms.pulseTime.value = pulseTime\n      })\n      updateModelState(false)\n",
            ),
          ]

          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'Expected AtlasScene source fragment not found: {old[:100]!r}')
            text = text.replace(old, new, 1)

          scene_path.write_text(text)

          app_path = Path('src/App.jsx')
          app = app_path.read_text()
          old_copy = 'Scenario-affected anatomy is highlighted in warm orange.'
          new_copy = 'Scenario-affected anatomy is highlighted with a slow yellow pulse.'
          if old_copy not in app:
            raise SystemExit('Expected inspector copy not found in App.jsx')
          app_path.write_text(app.replace(old_copy, new_copy, 1))
          PY
      - name: Validate production build
        run: |
          npm install
          npm run build
      - name: Commit source change
        run: |
          rm .github/workflows/apply-scenario-pulse.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AtlasScene.jsx src/App.jsx .github/workflows/apply-scenario-pulse.yml
          git commit -m "Add pulsing yellow scenario anatomy highlighting"
          git push origin main
