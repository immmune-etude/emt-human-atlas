name: Apply green scenario highlight and outline

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch scenario highlight rendering
        run: python scripts/apply_green_outline.py

      - name: Validate production build
        run: |
          npm install
          npm run build

      - name: Commit source update
        run: |
          rm .github/workflows/apply-green-outline.yml
          rm scripts/apply_green_outline.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AtlasScene.jsx src/App.jsx .github/workflows/apply-green-outline.yml scripts/apply_green_outline.py
          git commit -m "Use pulsating green scenario highlights with outline"
          git push origin main
